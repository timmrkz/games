<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-label="Where we go: the server owns, the client renders">
<style>
.t{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.n{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.p{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
.q{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.c{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.bg{fill:#ffffff}
.box{fill:none;stroke:#b6bcc4;stroke-width:1.25}
.dash{fill:none;stroke:#b6bcc4;stroke-width:1.25;stroke-dasharray:4 4}
.chip{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.ax{stroke:#8c959f;stroke-width:1.25;fill:none}
.ah{fill:#8c959f}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
.t,.n,.c{fill:#f0f6fc}.p,.q{fill:#9198a1}
.box,.dash{stroke:#5d6570}
.chip{fill:#212830;stroke:#3d444d}.ax{stroke:#7d8590}.ah{fill:#7d8590}}
</style>
<rect class="bg" width="760" height="510" rx="12"/>
<text class="t" x="24" y="30">Where we go: the server owns, the client renders</text>
<text class="q" x="24" y="50">may use</text>
<path class="ax" d="M40 60V480"/>
<path class="ah" d="M35 476L40 486L45 476z"/>
<rect class="box" x="64" y="56" width="672" height="94" rx="8"/>
<text class="n" x="76" y="78">the client</text>
<text class="p" x="76" y="96">not yet</text>
<rect class="chip" x="76" y="106" width="180" height="22" rx="6"/>
<text class="c" x="84" y="121">draws what the server sent</text>
<rect class="chip" x="262" y="106" width="174" height="22" rx="6"/>
<text class="c" x="270" y="121">sends what the person did</text>
<rect class="chip" x="442" y="106" width="180" height="22" rx="6"/>
<text class="c" x="450" y="121">what the hand is doing now</text>
<rect class="box" x="64" y="166" width="672" height="94" rx="8"/>
<text class="n" x="76" y="188">the server API</text>
<text class="p" x="76" y="206">not yet</text>
<rect class="chip" x="76" y="216" width="79" height="22" rx="6"/>
<text class="c" x="84" y="231">intents in</text>
<rect class="chip" x="161" y="216" width="73" height="22" rx="6"/>
<text class="c" x="169" y="231">state out</text>
<rect class="chip" x="240" y="216" width="155" height="22" rx="6"/>
<text class="c" x="248" y="231">checks at the boundary</text>
<rect class="box" x="64" y="276" width="672" height="94" rx="8"/>
<text class="n" x="76" y="298">the core</text>
<text class="p" x="76" y="316">not yet</text>
<rect class="chip" x="76" y="326" width="48" height="22" rx="6"/>
<text class="c" x="84" y="341">games</text>
<rect class="chip" x="130" y="326" width="123" height="22" rx="6"/>
<text class="c" x="138" y="341">labels and groups</text>
<rect class="chip" x="259" y="326" width="117" height="22" rx="6"/>
<text class="c" x="267" y="341">the filter chain</text>
<rect class="chip" x="382" y="326" width="98" height="22" rx="6"/>
<text class="c" x="390" y="341">what is valid</text>
<rect class="chip" x="486" y="326" width="35" height="22" rx="6"/>
<text class="c" x="494" y="341">ids</text>
<rect class="box" x="64" y="386" width="672" height="94" rx="8"/>
<text class="n" x="76" y="408">storage</text>
<text class="p" x="76" y="426">not yet</text>
<rect class="chip" x="76" y="436" width="123" height="22" rx="6"/>
<text class="c" x="84" y="451">plain files first</text>
<rect class="chip" x="205" y="436" width="192" height="22" rx="6"/>
<text class="c" x="213" y="451">a database once it is needed</text>
</svg>
