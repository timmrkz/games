<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" role="img" aria-label="The page today: one file holds every layer">
<style>
.t{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.n{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.p{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
.q{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.c{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.bg{fill:#ffffff}
.box{fill:none;stroke:#b6bcc4;stroke-width:1.25}
.dash{fill:none;stroke:#b6bcc4;stroke-width:1.25;stroke-dasharray:4 4}
.chip{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.ax{stroke:#8c959f;stroke-width:1.25;fill:none}
.ah{fill:#8c959f}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
.t,.n,.c{fill:#f0f6fc}.p,.q{fill:#9198a1}
.box,.dash{stroke:#5d6570}
.chip{fill:#212830;stroke:#3d444d}.ax{stroke:#7d8590}.ah{fill:#7d8590}}
</style>
<rect class="bg" width="760" height="484" rx="12"/>
<text class="t" x="24" y="30">The page today: one file holds every layer</text>
<text class="q" x="24" y="50">may use</text>
<path class="ax" d="M40 60V454"/>
<path class="ah" d="M35 450L40 460L45 450z"/>
<rect class="box" x="64" y="56" width="672" height="150" rx="8"/>
<text class="n" x="76" y="78">the page</text>
<text class="p" x="76" y="96">index.html</text>
<rect class="chip" x="76" y="106" width="300" height="22" rx="6"/>
<text class="c" x="84" y="121">views: catalog, detail, editor, labels, print</text>
<rect class="chip" x="382" y="106" width="218" height="22" rx="6"/>
<text class="c" x="390" y="121">drawing: renderCatalog, cardHTML</text>
<rect class="chip" x="76" y="134" width="268" height="22" rx="6"/>
<text class="c" x="84" y="149">the filter chain: evaluateChain, matches</text>
<rect class="chip" x="350" y="134" width="192" height="22" rx="6"/>
<text class="c" x="358" y="149">reading a catalog: normalize</text>
<rect class="chip" x="76" y="162" width="224" height="22" rx="6"/>
<text class="c" x="84" y="177">the local layer: mergeLocal, save</text>
<rect class="chip" x="306" y="162" width="123" height="22" rx="6"/>
<text class="c" x="314" y="177">import and export</text>
<rect class="chip" x="435" y="162" width="129" height="22" rx="6"/>
<text class="c" x="443" y="177">the seed: BUILT_IN</text>
<rect class="box" x="64" y="222" width="328" height="122" rx="8"/>
<text class="n" x="76" y="244">the published catalog</text>
<text class="p" x="76" y="262">games.json</text>
<rect class="chip" x="76" y="272" width="54" height="22" rx="6"/>
<text class="c" x="84" y="287">labels</text>
<rect class="chip" x="136" y="272" width="54" height="22" rx="6"/>
<text class="c" x="144" y="287">groups</text>
<rect class="chip" x="196" y="272" width="48" height="22" rx="6"/>
<text class="c" x="204" y="287">games</text>
<rect class="box" x="408" y="222" width="328" height="122" rx="8"/>
<text class="n" x="420" y="244">what this browser changed</text>
<text class="p" x="420" y="262">localStorage</text>
<rect class="chip" x="420" y="272" width="230" height="22" rx="6"/>
<text class="c" x="428" y="287">games, labels, groups changed here</text>
<rect class="chip" x="420" y="300" width="117" height="22" rx="6"/>
<text class="c" x="428" y="315">ids removed here</text>
<rect class="dash" x="64" y="360" width="672" height="94" rx="8"/>
<text class="n" x="76" y="382">hosting</text>
<text class="p" x="76" y="400">GitHub Pages, CNAME</text>
<rect class="chip" x="76" y="410" width="211" height="22" rx="6"/>
<text class="c" x="84" y="425">static files, no server of ours</text>
</svg>
